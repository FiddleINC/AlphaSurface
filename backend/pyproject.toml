[project]
name = "backend"
version = "0.1.0"
description = "AlphaSurface whiteboard backend: Claude canvas agent, ink recognition, Realtime voice keys"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "fastapi[standard]>=0.135.1",
    "httpx>=0.28.1",
    "openai>=3.51.0",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.41.0",
    "websockets>=16.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
